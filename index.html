<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Inkwell Notes</title>
<meta name="theme-color" content="#2f56c9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inkwell">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a desk (library shelf of covers) and a writing surface (one paper sheet in a pannable viewport under a two-row tool bar) */
:root{
  --desk:#e9edf2; --surface:#ffffff; --fg:#17202b; --muted:#5d6979; --line:#d5dce5;
  --accent:#2f56c9; --accent-ink:#ffffff; --accent-soft:#e3eafb; --danger:#b8323b;
  --paper:#fdfdfb; --shadow:0 1px 2px rgba(20,30,50,.08),0 6px 18px rgba(20,30,50,.10);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#11151b; --surface:#1a2029; --fg:#e6eaf0; --muted:#94a0b1; --line:#2b3441;
  --accent:#86a3ff; --accent-ink:#0d1424; --accent-soft:#232e47; --danger:#ff7b84;
  --paper:#f4f3ee; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#11151b; --surface:#1a2029; --fg:#e6eaf0; --muted:#94a0b1; --line:#2b3441;
  --accent:#86a3ff; --accent-ink:#0d1424; --accent-soft:#232e47; --danger:#ff7b84;
  --paper:#f4f3ee; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}
html{box-sizing:border-box;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:inherit}
body{-webkit-text-size-adjust:100%;background:var(--desk);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
#app{height:100%;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column}

/* Library */
#library{overflow-y:auto;-webkit-overflow-scrolling:touch}
.lib-inner{max-width:1080px;width:100%;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px;display:flex;flex-direction:column;gap:22px}
.lib-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.lib-head h1{font-family:var(--f-display);font-weight:700;font-size:2rem;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lib-head p{margin:4px 0 0;color:var(--muted);max-width:46ch}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;font-weight:700;background:var(--surface);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.notice{padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--fg);font-size:.93rem}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px}
.nb{display:flex;flex-direction:column;gap:8px;min-width:0}
.cover{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:6px 12px 12px 6px;background:var(--c);box-shadow:var(--shadow);overflow:hidden;text-align:left}
.cover::before{content:"";position:absolute;inset:0 auto 0 0;width:14px;background:rgba(0,0,0,.18)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.18),transparent 40%)}
.cover .label{position:absolute;left:26px;right:14px;top:18%;background:#fbfaf6;color:#1d2430;border-radius:4px;padding:10px 10px 12px;font-family:var(--f-display);font-weight:700;font-size:1rem;line-height:1.2;overflow-wrap:anywhere;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.cover .kind{position:absolute;left:26px;bottom:12px;font-size:.7rem;font-weight:700;letter-spacing:.08em;color:#fff;background:rgba(0,0,0,.28);padding:3px 7px;border-radius:5px}
.cover:active{transform:scale(.98)}
.nb-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.nb-meta span{color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:10px;flex:none}
.icon-btn:hover{background:var(--accent-soft)}
.icon-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.icon-btn:disabled{opacity:.35;cursor:default}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:48px 16px;color:var(--muted)}
.empty .ghost{width:120px;aspect-ratio:3/4;border:2px dashed var(--line);border-radius:6px 12px 12px 6px}
.empty h2{font-family:var(--f-display);color:var(--fg);margin:6px 0 0;font-size:1.25rem}

/* Editor */
.ed-bar{background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;z-index:2}
.row1{display:flex;align-items:center;gap:4px;height:52px;min-width:0}
.title-btn{flex:1;min-width:0;text-align:left;padding:6px 8px;border-radius:8px;font-family:var(--f-display);font-weight:700;font-size:1.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{flex:none;font-size:.78rem;color:var(--muted);padding:4px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.sync[data-s="saving"]{color:var(--accent)}
.sync[data-s="err"],.sync[data-s="local"]{color:var(--danger);border-color:currentColor}
.row2{display:flex;align-items:center;gap:4px;padding-bottom:8px;overflow-x:auto;scrollbar-width:none}
.row2::-webkit-scrollbar{display:none}
.sep{width:1px;height:26px;background:var(--line);margin:0 6px;flex:none}
.swatch{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center}
.swatch i{width:20px;height:20px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.size{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:8px}
.size i{background:var(--fg);border-radius:50%}
.size[aria-pressed="true"]{background:var(--accent-soft)}
.chip{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:.82rem;font-weight:700;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.vp{flex:1;min-height:0;overflow:auto;position:relative;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;padding:16px}
.sheet{position:relative;margin:0 auto;background:var(--paper);box-shadow:var(--shadow);border-radius:2px}
.sheet canvas{position:absolute;inset:0;width:100%;height:100%}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:#5d6979;font-size:.95rem}
.pager{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow);z-index:3}
.pager .count{padding:8px 6px;border-radius:8px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums;font-size:.9rem;font-weight:700}
.zoom{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:3}
.ed-wrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
@media (max-width:520px){.zoom{bottom:calc(72px + env(safe-area-inset-bottom,0px))}}

.drawer{position:absolute;inset:0 0 0 auto;width:min(340px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:5;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 10px 18px;border-bottom:1px solid var(--line)}
.drawer h2{margin:0;font-family:var(--f-display);font-size:1.1rem}
.thumbs{flex:1;overflow-y:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.thumb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.thumb canvas{width:100%;aspect-ratio:1000/1414;background:var(--paper);box-shadow:var(--shadow);border-radius:2px}
.thumb[aria-current="true"] canvas{outline:3px solid var(--accent);outline-offset:2px}
.thumb[aria-current="true"]{color:var(--fg);font-weight:700}

.menu{position:absolute;top:56px;right:max(8px,env(safe-area-inset-right,0px));z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:230px;display:flex;flex-direction:column}
.menu button{text-align:left;padding:11px 12px;border-radius:9px}
.menu button:hover{background:var(--accent-soft)}
.menu .lbl{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 12px 4px}
.menu .tpls{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 6px 6px}
.menu .tpls button{text-align:center;font-size:.8rem;padding:8px 2px;border:1px solid var(--line)}
.menu .tpls button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.menu .danger{color:var(--danger)}

.modal{position:fixed;inset:0;background:rgba(10,14,20,.45);display:grid;place-items:center;z-index:20;padding:16px}
.card{background:var(--surface);border-radius:18px;padding:20px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.card h2{margin:0;font-family:var(--f-display);font-size:1.25rem}
.card p{margin:0;color:var(--muted)}
.card label{font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card input[type=text]{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--desk);color:var(--fg);font:inherit;font-size:16px}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick-c{width:34px;height:34px;border-radius:8px;background:var(--c)}
.pick-c[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.pick-t{padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-size:.9rem}
.pick-t[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#signin{align-items:center;justify-content:center;overflow-y:auto}
.signin-card{width:min(400px,100%);display:flex;flex-direction:column;gap:14px;padding-block:32px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));box-sizing:border-box}
.signin-card h1{font-family:var(--f-display);font-size:2.2rem;letter-spacing:-.02em;margin:0}
.signin-card p{margin:0;color:var(--muted)}
.signin-card input{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:16px}
.signin-card .btn{justify-content:center}
.linkish{color:var(--accent);font-weight:700;padding:6px 0;align-self:flex-start}
.err{color:var(--danger);font-size:.92rem;min-height:1.2em}
.progress{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(92vw,420px);box-sizing:border-box;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;z-index:30;display:flex;flex-direction:column;gap:4px}
.progress strong{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress span{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.progress .track{height:6px;border-radius:3px;background:var(--accent-soft);overflow:hidden;margin-top:4px}
.progress .track i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:var(--fg);color:var(--desk);padding:10px 16px;border-radius:12px;z-index:30;font-size:.92rem;max-width:min(90vw,420px);text-align:center;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="app">
  <section id="signin" class="view" hidden>
    <form id="signinForm" class="signin-card">
      <h1>Inkwell</h1>
      <p id="signinIntro">Sign in to see your notebooks on this device. Use the same email on your iPad and your phone.</p>
      <input id="email" type="email" autocomplete="email" placeholder="Email" required>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password (6+ characters)" minlength="6" required>
      <div id="signinErr" class="err" role="alert"></div>
      <button id="signinBtn" class="btn primary" type="submit">Sign in</button>
      <button id="toggleMode" class="linkish" type="button">New here? Create an account</button>
      <button id="resetPw" class="linkish" type="button">Forgot password?</button>
    </form>
  </section>
  <section id="library" class="view">
    <div class="lib-inner">
      <div class="lib-head">
        <div>
          <h1>Notebooks</h1>
          <p>Write on your iPad, carry on from your phone. Every stroke saves to your account, private to you.</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button id="signOut" class="btn" type="button">Sign out</button><button id="importPdf" class="btn" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path d="M4 14v4.5A1.5 1.5 0 005.5 20h13a1.5 1.5 0 001.5-1.5V14"/></svg>Import PDF</button><input id="pdfInput" type="file" accept="application/pdf,.pdf" hidden><button id="newNb" class="btn primary" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New notebook</button></div>
      </div>
      <div id="libNotice" class="notice" hidden></div>
      <div id="shelf" class="shelf"></div>
      <div id="emptyShelf" class="empty" hidden>
        <div class="ghost"></div>
        <h2 id="emptyTitle">Loading your notebooks…</h2>
        <p id="emptyText"></p>
      </div>
    </div>
  </section>

  <section id="editor" class="view" hidden>
    <header class="ed-bar">
      <div class="row1">
        <button id="back" class="icon-btn" type="button" aria-label="Back to notebooks"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button id="nbTitle" class="title-btn" type="button" aria-label="Rename notebook"></button>
        <span id="sync" class="sync" data-s="ok">Saved</span>
        <button id="pagesBtn" class="icon-btn" type="button" aria-label="All pages"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="7" height="8" rx="1.2"/><rect x="13" y="3" width="7" height="8" rx="1.2"/><rect x="4" y="13" width="7" height="8" rx="1.2"/><rect x="13" y="13" width="7" height="8" rx="1.2"/></svg></button>
        <button id="moreBtn" class="icon-btn" type="button" aria-label="More options"><svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></button>
      </div>
      <div class="row2" id="tools">
        <button class="icon-btn" data-tool="p" type="button" aria-label="Pen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20l4.2-1L19.5 7.7a2.1 2.1 0 00-3-3L5.2 16 4 20z"/><path d="M14.5 6.5l3 3"/></svg></button>
        <button class="icon-btn" data-tool="h" type="button" aria-label="Highlighter"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 14.5L15.5 4l4.5 3-6.5 10.5z"/><path d="M9 14.5l-1.5 3 4.5 0 1.5-1"/><path d="M4 21h16"/></svg></button>
        <button class="icon-btn" data-tool="e" type="button" aria-label="Eraser"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8.5 19.5L3.8 14.8a1.5 1.5 0 010-2.1l8.5-8.5a1.5 1.5 0 012.1 0l5.4 5.4a1.5 1.5 0 010 2.1l-7.8 7.8z"/><path d="M8 9.5l6.5 6.5M8.5 19.5H20"/></svg></button>
        <button class="icon-btn" data-tool="hand" id="handBtn" type="button" aria-label="Move page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12.5V5.5a1.5 1.5 0 013 0V11M11 10.5V4a1.5 1.5 0 013 0v7M14 10.5V5.5a1.5 1.5 0 013 0V14c0 4-2.5 6.5-6 6.5-2.6 0-4.1-1.1-5.6-3.2L3.6 14.6c-.8-1.1.6-2.5 1.7-1.7L8 15"/></svg></button>
        <span class="sep"></span>
        <span id="swatches" style="display:contents"></span>
        <span class="sep" id="sep2"></span>
        <span id="sizes" style="display:contents"></span>
        <span class="sep"></span>
        <button id="undo" class="icon-btn" type="button" aria-label="Undo"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg></button>
        <button id="redo" class="icon-btn" type="button" aria-label="Redo"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg></button>
        <span class="sep"></span>
        <button id="penOnly" class="chip" type="button" aria-pressed="false">Pencil only</button>
      </div>
    </header>
    <div class="ed-wrap">
      <div id="vp" class="vp">
        <div id="sheet" class="sheet">
          <canvas id="base"></canvas>
          <canvas id="live"></canvas>
          <div id="loading" class="loading">Opening notebook…</div>
        </div>
      </div>
      <nav class="pager" aria-label="Pages">
        <button id="prev" class="icon-btn" type="button" aria-label="Previous page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button id="count" class="count" type="button" aria-label="Go to page">1 / 1</button>
        <button id="next" class="icon-btn" type="button" aria-label="Next page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
        <button id="addPage" class="icon-btn" type="button" aria-label="Add a page after this one"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </nav>
      <div class="zoom">
        <button id="zin" class="icon-btn" type="button" aria-label="Zoom in"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button id="zfit" class="icon-btn" type="button" aria-label="Fit page to width" style="font-size:.72rem;font-weight:700">FIT</button>

  for(const c of list){const on=(S.tool==='p'?S.ink:S.high)===c;sw.append(el('button',{class:'swatch',type:'button','aria-label':'Colour','aria-pressed':on,style:'--sw:'+c,onclick:()=>{if(S.tool==='p'){S.ink=c;setPref('ink',c)}else{S.high=c;setPref('high',c)}renderTools()}},el('i')))}

function goPage(i){const nb=curNb();if(!nb)return;S.pageIdx=Math.max(0,Math.min(nb.pages.length-1,i));setPref('page.'+S.nbId,S.pageIdx);vp.scrollTop=0;refreshEditorChrome();scheduleBase()}
let thumbObs=null;
function drawThumb(c){const pg=curNb()&&curNb().pages[+c.dataset.i];if(!pg)return;const ctx=c.getContext('2d');
  if(pg.tpl==='pdf'){const b=bgFor(pg.id);if(!b.img){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,200,283);b.onload=()=>{if(c.isConnected)renderPageTo(ctx,200/PW,pg)};return}}
  renderPageTo(ctx,200/PW,pg)}
function renderThumbs(){
  const nb=curNb();const box=$('#thumbs');box.replaceChildren();
  $('#drawerTitle').textContent=nb.pages.length+(nb.pages.length===1?' page':' pages');
  if(thumbObs)thumbObs.disconnect();
  thumbObs=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){thumbObs.unobserve(e.target);drawThumb(e.target)}},{root:box,rootMargin:'400px 0px'});
  let current=null;
  nb.pages.forEach((pg,i)=>{const c=el('canvas',{width:'200',height:'283','data-i':String(i)});thumbObs.observe(c);
    const b=el('button',{class:'thumb',type:'button','aria-current':i===S.pageIdx,onclick:()=>{goPage(i);if(innerWidth<700)$('#drawer').hidden=true}},c,'Page '+(i+1));
    if(i===S.pageIdx)current=b;box.append(b)});
  if(current)requestAnimationFrame(()=>current.scrollIntoView({block:'center'}));
}

async function openNotebook(id){
  const nb=S.notebooks.get(id);if(!nb)return;
  if(!(history.state&&history.state.nb))history.pushState({nb:id},'');
  S.nbId=id;S.strokes=new Map();S.chunks=new Map();S.undo=new Map();S.redo=new Map();S.zoom=1;
  S.pageIdx=Math.min(pref('page.'+id,0),nb.pages.length-1);
  $('#library').hidden=true;$('#editor').hidden=false;$('#drawer').hidden=true;$('#menu').hidden=true;
  setSync(S.local?'local':'ok');renderTools();refreshEditorChrome();layoutSheet();
  $('#loading').hidden=S.local;base.style.visibility=S.local?'visible':'hidden';
  renderBase();
  if(S.db){
    if(S.unsub)S.unsub();
    S.unsub=S.lib.doc(id).collection('chunks').onSnapshot(onChunks,e=>writeError(e));
  }
}
function onChunks(snap){
  let touched=new Set();
  for(const ch of snap.docChanges()){
    const k=ch.doc.id;if(dirty.has(k)||inflight.has(k)||ch.doc.metadata.hasPendingWrites)continue;
    if(ch.type==='removed'){const c=S.chunks.get(k);if(c)touched.add(c.page);removeChunkLocal(k)}
    else{const d=ch.doc.data();if(!d||!d.page)continue;applyChunk(k,d);touched.add(d.page)}
  }
  $('#loading').hidden=true;base.style.visibility='visible';
  const pg=curPage();if(pg&&(touched.has(pg.id)||!S.ready2)){S.ready2=true;scheduleBase()}
  if(!$('#drawer').hidden&&touched.size)renderThumbs();
}
async function closeNotebook(){
  $('#editor').hidden=true;$('#library').hidden=false;renderLibrary();
  try{await flush()}catch(e){}
  if(S.unsub){S.unsub();S.unsub=null}S.nbId=null;S.ready2=false;
}

/* ---------- input ---------- */
let drawing=null;const touches=new Map();let gesture=null,penDown=false;
function toPage(e,r){return[(e.clientX-r.left)/r.width*PW,(e.clientY-r.top)/r.height*PH]}
function pushPoint(st,x,y,pr){const p=st.p,L=p.length;const X=Math.round(x*2),Y=Math.round(y*2);if(L&&Math.abs(p[L-3]-X)<2&&Math.abs(p[L-2]-Y)<2)return;p.push(X,Y,Math.max(0,Math.min(9,Math.round(pr*9))))}
function pressureOf(e,prev){if(e.pointerType!=='pen'||!e.pressure)return .5;const v=Math.min(1,e.pressure*1.1);return prev==null?v:prev*.55+v*.45}
function startDraw(e){
  if(S.readOnly){toast('This view can read notebooks but can’t save changes.');return}
  const pg=curPage();if(!pg)return;
  const r=sheet.getBoundingClientRect();const [x,y]=toPage(e,r);
  drawing={id:e.pointerId,touch:e.pointerType==='touch',r,pid:pg.id,t0:performance.now(),pr:null};
  if(S.tool==='e'){drawing.erased=[];eraseAt(x,y)}
  else{const st={i:newId(),t:S.tool,c:S.tool==='p'?S.ink:S.high,w:SIZES[S.tool][S.size[S.tool]],s:Date.now(),p:[]};drawing.pr=pressureOf(e);pushPoint(st,x,y,drawing.pr);drawing.st=st}
  try{vp.setPointerCapture(e.pointerId)}catch(_){}
  scheduleLive();
}
function moveDraw(e){
  const evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[e];
  for(const ev of (evs.length?evs:[e])){const [x,y]=toPage(ev,drawing.r);
    if(drawing.st){drawing.pr=pressureOf(ev,drawing.pr);pushPoint(drawing.st,x,y,drawing.pr)}else eraseAt(x,y)}
  scheduleLive();
}
function endDraw(cancel){
  const d=drawing;drawing=null;cursor=null;if(!d)return;
  if(d.st&&!cancel&&d.st.p.length){addStroke(d.pid,d.st);record(d.pid,{a:'add',strokes:[d.st]});bctx.setTransform(pxScale,0,0,pxScale,0,0);drawStroke(bctx,d.st)}
  if(d.erased&&d.erased.length)record(d.pid,{a:'erase',strokes:d.erased});
  scheduleLive();refreshEditorChrome();
}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay;const l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));const ex=ax+t*dx-px,ey=ay+t*dy-py;return Math.sqrt(ex*ex+ey*ey)}
function eraseAt(x,y){
  const r=SIZES.e[S.size.e];cursor=[x,y,r];const a=S.strokes.get(drawing.pid)||[];let hit=false;
  for(let i=a.length-1;i>=0;i--){const st=a[i],p=st.p,n=p.length/3,lim=r+st.w/2;let h=false;
    for(let j=0;j<n&&!h;j++){const ax=p[j*3]/2,ay=p[j*3+1]/2;if(n===1||j===n-1){if(Math.hypot(ax-x,ay-y)<lim)h=true}else if(segDist(x,y,ax,ay,p[j*3+3]/2,p[j*3+4]/2)<lim)h=true}
    if(h){removeStroke(drawing.pid,st);drawing.erased.push(st);hit=true}}
  if(hit)scheduleBase();
}
function record(pid,op){if(!S.undo.has(pid))S.undo.set(pid,[]);const u=S.undo.get(pid);u.push(op);if(u.length>200)u.shift();S.redo.set(pid,[])}
function undoRedo(isUndo){
  const pid=curPage().id;const from=(isUndo?S.undo:S.redo).get(pid)||[];const op=from.pop();if(!op)return;
  const to=isUndo?S.redo:S.undo;if(!to.has(pid))to.set(pid,[]);to.get(pid).push(op);
  const removing=(op.a==='add')===isUndo;
  for(const st of op.strokes){if(removing)removeStroke(pid,st);else addStroke(pid,st)}
  scheduleBase();refreshEditorChrome();
}

function touchPan(e){const t=touches.get(e.pointerId);if(!t)return;const nx=e.clientX,ny=e.clientY;
  if(touches.size>=2){const pts=[...touches.values()];const [a,b]=pts;const d0=Math.hypot(a.x-b.x,a.y-b.y);const m0=[(a.x+b.x)/2,(a.y+b.y)/2];
    t.x=nx;t.y=ny;const [c,d]=[...touches.values()];const d1=Math.hypot(c.x-d.x,c.y-d.y);const m1=[(c.x+d.x)/2,(c.y+d.y)/2];
    if(d0>10)setZoom(S.zoom*d1/d0,m1[0],m1[1]);vp.scrollLeft-=m1[0]-m0[0];vp.scrollTop-=m1[1]-m0[1];}
  else{vp.scrollLeft-=nx-t.x;vp.scrollTop-=ny-t.y;t.x=nx;t.y=ny}
}
vp.addEventListener('pointerdown',e=>{
  if(e.button>0)return;
  if(e.pointerType==='pen'){
    penDown=true;
    if(!S.penOnly){S.penOnly=true;setPref('penOnly',true);if(S.tool==='hand')S.tool='p';renderTools();toast('Pencil detected. Fingers now scroll and zoom; switch off “Pencil only” to draw with a finger.')}
    touches.clear();if(drawing&&drawing.touch)endDraw(true);
    return startDraw(e);
  }
  if(e.pointerType==='touch'){
    if(penDown)return;
    touches.set(e.pointerId,{x:e.clientX,y:e.clientY});try{vp.setPointerCapture(e.pointerId)}catch(_){}
    if(drawing&&drawing.touch){if(touches.size>=2){const keep=performance.now()-drawing.t0>350&&drawing.st&&drawing.st.p.length>30;endDraw(!keep)}return}
    if(touches.size===1&&!S.penOnly&&S.tool!=='hand'){touches.delete(e.pointerId);return startDraw(e)}
    return;
  }
  if(S.tool==='hand'){gesture={x:e.clientX,y:e.clientY,id:e.pointerId};try{vp.setPointerCapture(e.pointerId)}catch(_){}return}
  startDraw(e);
});
vp.addEventListener('pointermove',e=>{
  if(drawing&&drawing.id===e.pointerId)return moveDraw(e);
  if(e.pointerType==='touch'&&touches.has(e.pointerId))return touchPan(e);
  if(gesture&&gesture.id===e.pointerId){vp.scrollLeft-=e.clientX-gesture.x;vp.scrollTop-=e.clientY-gesture.y;gesture.x=e.clientX;gesture.y=e.clientY}
});
const up=e=>{
  if(e.pointerType==='pen')penDown=false;
  if(drawing&&drawing.id===e.pointerId)endDraw(e.type==='pointercancel'&&!!drawing.st);
  if(touches.has(e.pointerId)){touches.delete(e.pointerId);if(!touches.size)scheduleBase()}
  if(gesture&&gesture.id===e.pointerId)gesture=null;
};
vp.addEventListener('pointerup',up);vp.addEventListener('pointercancel',up);
vp.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setZoom(S.zoom*Math.exp(-e.deltaY*.01),e.clientX,e.clientY)}},{passive:false});
['gesturestart','gesturechange','contextmenu'].forEach(t=>vp.addEventListener(t,e=>e.preventDefault()));

/* ---------- files: save, PDF export, PDF import ---------- */
const safeName=t=>(t||'Notebook').replace(/[\\/:*?"<>|]+/g,'').trim()||'Notebook';
const blobToB64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)});
async function saveFile(name,blob){
  if(window.Capacitor){
    if(!window.InkNative)return toast('Saving files isn’t available in this version of the app.');
    try{await window.InkNative.saveFile(name,await blobToB64(blob))}catch(e){if(!/cancel/i.test(String(e&&e.message)))toast('Couldn’t save the file. Try again.')}
    return;
  }
  const f=new File([blob],name,{type:blob.type});
  if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f],title:name});return}catch(e){if(e&&e.name==='AbortError')return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
}
const scripts=new Map();
function loadScript(src){if(!scripts.has(src))scripts.set(src,new Promise((res,rej)=>{const t=document.createElement('script');t.src=src;t.onload=res;t.onerror=()=>{scripts.delete(src);rej(new Error('offline'))};document.head.append(t)}));return scripts.get(src)}
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const JSPDF='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
let busy=false,importingId=null;
async function wakeLock(){try{return navigator.wakeLock?await navigator.wakeLock.request('screen'):null}catch(e){return null}}
function progress(title,detail,frac){const p=$('#progress');if(!title){p.hidden=true;return}
  p.hidden=false;$('#progTitle').textContent=title;$('#progDetail').textContent=detail||'';$('#progBar').style.width=Math.round((frac||0)*100)+'%'}

$('#mExport').onclick=()=>{$('#menu').hidden=true;const pg=curPage();const c=document.createElement('canvas');c.width=1600;c.height=Math.round(1600*PH/PW);
  const go=()=>{renderPageTo(c.getContext('2d'),1600/PW,pg);c.toBlob(b=>saveFile(safeName(curNb().title)+' - page '+(S.pageIdx+1)+'.png',b),'image/png')};
  if(pg.tpl==='pdf'){const bg=bgFor(pg.id);(bg.img?Promise.resolve():bg.ready).then(go)}else go()};

$('#mPdf').onclick=async()=>{
  $('#menu').hidden=true;if(busy)return;busy=true;
  const nb=curNb(),id=S.nbId;
  try{
    progress('Preparing PDF','',0);
    await loadScript(JSPDF);
    const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4',compress:true});
    const c=document.createElement('canvas');c.width=1100;c.height=1556;const ctx=c.getContext('2d');const lock=await wakeLock();
    try{for(let i=0;i<nb.pages.length;i++){
      if(S.nbId!==id)return;
      const pg=nb.pages[i];
      if(pg.tpl==='pdf'){const b=bgFor(pg.id);if(!b.img)await b.ready}
      renderPageTo(ctx,1100/PW,pg);
      if(i)pdf.addPage('a4','portrait');
      pdf.addImage(c.toDataURL('image/jpeg',.82),'JPEG',0,0,595.28,841.89,undefined,'FAST');
      if(nb.pages.length>3)progress('Preparing PDF','page '+(i+1)+' of '+nb.pages.length,(i+1)/nb.pages.length);
    }}finally{lock&&lock.release().catch(()=>{});progress()}
    await saveFile(safeName(nb.title)+'.pdf',pdf.output('blob'));
  }catch(e){toast(e&&e.message==='offline'?'Connect to the internet to create a PDF, then try again.':'Couldn’t create the PDF. Try again.')}
  finally{busy=false}
};

$('#importPdf').onclick=()=>{if(busy)return toast('An import is already running.');$('#pdfInput').value='';$('#pdfInput').click()};
$('#pdfInput').onchange=async()=>{
  const file=$('#pdfInput').files[0];if(!file)return;
  if(!S.db)return toast('Sign in first to import a PDF.');
  busy=true;const id='nb'+newId();let pages=[],started=false,lock=null;
  const title=file.name.replace(/\.pdf$/i,'')||'Imported PDF';
  const color=COVERS[Math.floor(Math.random()*COVERS.length)],created=Date.now();
  const saveMeta=done=>saveNb(id,{title,color,tpl:'blank',pdf:true,pages:pages.slice(),created,updated:Date.now(),importing:!done});
  try{
    progress('Opening '+file.name,'',0);
    await loadScript(PDFJS);
    const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
    const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    const n=doc.numPages;if(n>1000)throw new Error('toolong');
    if(n>60&&!await confirmBox('Import '+n+' pages?','This takes about '+Math.max(2,Math.round(n/90))+'–'+Math.max(3,Math.round(n/45))+' minutes. Keep Inkwell open and the screen on until it finishes. Pages you’ve imported are kept even if it stops part-way.','Import'))return;
    lock=await wakeLock();importingId=id;started=true;saveMeta(false);
    const c=document.createElement('canvas');const ctx=c.getContext('2d');
    const inflight=new Set();const t0=Date.now();
    for(let i=1;i<=n;i++){
      if(i>3){const left=Math.round((Date.now()-t0)/(i-1)*(n-i+1)/60000);progress('Importing '+title,'Page '+i+' of '+n+(left>=1?' · about '+left+' min left':''),(i-1)/n)}
      else progress('Importing '+title,'Page '+i+' of '+n,(i-1)/n);
      const page=await doc.getPage(i);const v1=page.getViewport({scale:1});
      // About 1300px on the long side keeps text sharp and pages small (typically 100–250 KB).
      let scale=1300/Math.max(v1.width,v1.height),img;
      for(const q of [.72,.6,.48]){
        const vp=page.getViewport({scale});c.width=Math.round(vp.width);c.height=Math.round(vp.height);
        ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
        await page.render({canvasContext:ctx,viewport:vp}).promise;
        img=c.toDataURL('image/jpeg',q);if(img.length<850000)break;scale*=.85;
      }
      page.cleanup();
      const pid='pg'+newId();
      const w=S.lib.doc(id).collection('bgs').doc(pid).set({img,w:c.width,h:c.height}).then(()=>inflight.delete(w));
      inflight.add(w);pages.push({id:pid,tpl:'pdf'});
      if(inflight.size>=4)await Promise.race(inflight);
      if(i%15===0)saveMeta(false);
    }
    await Promise.all(inflight);
    await doc.destroy();
    saveMeta(true);importingId=null;renderLibrary();
    toast('Imported '+n+(n===1?' page':' pages'));
    openNotebook(id);
  }catch(e){
    const m=e&&e.message;importingId=null;
    if(started&&pages.length)saveMeta(false);
    toast(m==='offline'?'Connect to the internet to import a PDF, then try again.':m==='toolong'?'That PDF has more than 1,000 pages. Split it into smaller files and import each one.':e&&e.name==='PasswordException'?'That PDF is password-protected. Remove the password and try again.':e&&e.code==='resource-exhausted'?'Your Firebase storage allowance is used up for today. The pages imported so far are saved.':started?'The import stopped part-way. The pages imported so far are saved in the notebook.':'Couldn’t import that PDF. Check it opens on this device and try again.');
  }finally{busy=false;progress();lock&&lock.release().catch(()=>{});renderLibrary()}
};

addEventListener('popstate',()=>{if(!$('#editor').hidden)closeNotebook()});
new ResizeObserver(()=>{if(!$('#editor').hidden){layoutSheet();scheduleBase()}}).observe(vp);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
addEventListener('pagehide',()=>flush());
addEventListener('keydown',e=>{if($('#editor').hidden||!$('#modal').hidden)return;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undoRedo(!e.shiftKey)}else if(e.key==='ArrowRight'&&!e.target.closest('input'))goPage(S.pageIdx+1);else if(e.key==='ArrowLeft'&&!e.target.closest('input'))goPage(S.pageIdx-1)});

/* ---------- boot ---------- */
if(history.state&&history.state.nb)history.replaceState(null,'');
renderLibrary();
let libUnsub=null,createMode=false;
const showView=v=>{for(const id of ['signin','library','editor'])$('#'+id).hidden=id!==v};
$('#toggleMode').onclick=()=>{createMode=!createMode;$('#signinBtn').textContent=createMode?'Create account':'Sign in';$('#toggleMode').textContent=createMode?'Already have an account? Sign in':'New here? Create an account';$('#password').autocomplete=createMode?'new-password':'current-password';$('#signinErr').textContent=''};
const authMsg=e=>({'auth/invalid-credential':'That email and password don’t match. Check them, or create an account if you’re new.','auth/wrong-password':'That password isn’t right.','auth/user-not-found':'No account with that email yet. Tap “Create an account”.','auth/email-already-in-use':'That email already has an account. Sign in instead.','auth/weak-password':'Use at least 6 characters.','auth/invalid-email':'Check the email address.','auth/operation-not-allowed':'Email sign-in isn’t switched on in Firebase yet (Authentication → Sign-in method → Email/Password).','auth/network-request-failed':'No internet connection. Connect and try again.','auth/too-many-requests':'Too many tries. Wait a minute and try again.'})[e&&e.code]||'Couldn’t sign in. Try again.';
$('#signinForm').addEventListener('submit',async e=>{e.preventDefault();const em=$('#email').value.trim(),pw=$('#password').value;$('#signinErr').textContent='';$('#signinBtn').disabled=true;
  try{if(createMode)await createUserWithEmailAndPassword(auth,em,pw);else await signInWithEmailAndPassword(auth,em,pw)}catch(err){$('#signinErr').textContent=authMsg(err)}finally{$('#signinBtn').disabled=false}});
$('#resetPw').onclick=async()=>{const em=$('#email').value.trim();if(!em){$('#signinErr').textContent='Type your email above first.';return}try{await sendPasswordResetEmail(auth,em);toast('Password reset email sent to '+em)}catch(err){$('#signinErr').textContent=authMsg(err)}};
$('#signOut').onclick=async()=>{if(await confirmBox('Sign out?','Your notebooks stay safe in your account. Sign in again to see them.','Sign out')){await flush();signOut(auth)}};
onAuthStateChanged(auth,u=>{
  if(libUnsub){libUnsub();libUnsub=null}
  if(S.unsub){S.unsub();S.unsub=null}
  S.notebooks=new Map();S.nbId=null;
  if(!u){S.db=null;S.uid=null;showView('signin');return}
  S.db=true;S.uid=u.uid;S.ready=true;S.lib=colRef('users/'+u.uid+'/notebooks');
  showView('library');renderLibrary();
  libUnsub=S.lib.onSnapshot(snap=>{
    for(const ch of snap.docChanges()){if(ch.type==='removed')S.notebooks.delete(ch.doc.id);else S.notebooks.set(ch.doc.id,ch.doc.data())}
    $('#libNotice').hidden=true;
    if(S.nbId){if(!S.notebooks.has(S.nbId)){toast('This notebook was deleted on another device.');closeNotebook()}else{refreshEditorChrome();scheduleBase()}}
    renderLibrary();
  },e=>{$('#libNotice').hidden=false;$('#libNotice').textContent=e.code==='permission-denied'?'Firebase is blocking access to your notebooks. Publish the Firestore security rules, then reopen the app.':'Can’t reach your notebooks right now. Check your connection and reopen the app.'});
});
})();
</script>
</body>
</html>
