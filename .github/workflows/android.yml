name: Build Android app

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "firestore.rules"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install build tools
        run: npm install --no-audit --no-fund

      - name: Bundle Firebase and native helpers
        run: |
          node build-www.mjs
          npx esbuild src/firebase-entry.js --bundle --format=esm --minify --outfile=www/vendor/firebase.js
          npx esbuild src/native-entry.js --bundle --format=esm --minify --outfile=www/vendor/native.js
          cp node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js www/vendor/
          cp node_modules/pdf-lib/dist/pdf-lib.min.js www/vendor/

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
          node customize-android.mjs

      - name: Build signed APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/native/signing/inkwell.jks \
            -Pandroid.injected.signing.store.password=inkwell-android \
            -Pandroid.injected.signing.key.alias=inkwell \
            -Pandroid.injected.signing.key.password=inkwell-android
          cp app/build/outputs/apk/release/app-release.apk $GITHUB_WORKSPACE/Inkwell.apk

      - name: Publish release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Inkwell.apk \
            --title "Inkwell 1.0.${{ github.run_number }}" \
            --notes "Android app. On your phone, download Inkwell.apk below and open it to install or update." \
            --latest
